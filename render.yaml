services:
  - type: web
    name: scalex-data-fitness-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://scale-x-ia.netlify.app
      - key: MODEL_API_URL
        sync: false
      - key: MODEL_API_KEY
        sync: false
      - key: MODEL_NAME
        sync: false
      - key: MODEL_TIMEOUT_SECONDS
        value: "60"
